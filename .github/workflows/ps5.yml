name: PS5 Build and Release

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pacbrew-repo
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/pacbrew-repo
          path: pacbrew-repo

      - name: Checkout SDK stubs
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          path: ps5-sdk

      - name: Checkout pinned AMPR format reader for host oracle
        uses: actions/checkout@v4
        with:
          repository: quer3q/ampr-emu-ng
          ref: 920e9172b6bf99bd9210361b545e2953659d1e9b
          path: ampr-emu-ng-reference

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf \
            automake \
            build-essential \
            cargo \
            clang-18 \
            cmake \
            curl \
            git \
            libarchive-tools \
            libtool \
            lld-18 \
            makepkg \
            meson \
            nasm \
            pacman-package-manager \
            patch \
            pkg-config \
            python3 \
            python3-yaml \
            rustc \
            xxd \
            zip

      - name: Run native FPKG host safety test
        run: |
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude -Isrc \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_fpkg_header.c src/sm_fpkg.c src/sm_fpkg_layout.c \
            src/sm_fpkg_image.c src/sm_fpkg_decoder.c src/sm_fpkg_tree.c \
            src/sm_fpkg_index.c \
            -o /tmp/sm-fpkg-header-test
          /tmp/sm-fpkg-header-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude -Isrc \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_fpkg_index.c src/sm_fpkg_index.c src/sm_fpkg.c \
            src/sm_fpkg_layout.c src/sm_fpkg_image.c src/sm_fpkg_decoder.c \
            src/sm_fpkg_tree.c -o /tmp/sm-fpkg-index-test
          /tmp/sm-fpkg-index-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude -Isrc \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_fpkg_layout.c src/sm_fpkg_layout.c -o /tmp/sm-fpkg-layout-test
          /tmp/sm-fpkg-layout-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_fpkg_decoder.c src/sm_fpkg_decoder.c \
            -o /tmp/sm-fpkg-decoder-test
          /tmp/sm-fpkg-decoder-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude -Isrc \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_fpkg_tree.c src/sm_fpkg_tree.c \
            -o /tmp/sm-fpkg-tree-test
          /tmp/sm-fpkg-tree-test
          git clone --filter=blob:none --no-checkout \
            https://github.com/quer3q/kraken-mount.git \
            kraken-mount-reference
          git -C kraken-mount-reference fetch --depth=1 origin \
            4b420d579bd381796d773875e36d14c9acaabf39
          git -C kraken-mount-reference checkout --detach FETCH_HEAD
          python3 tools/test_fpkg_decoder_reference.py \
            kraken-mount-reference
          python3 tools/test_fpkg_decoder_differential.py \
            kraken-mount-reference
          mkdir -p /tmp/fpkg-ampr-oracle
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude -Isrc \
            tests/fpkg_ampr_oracle/generate.c src/sm_fpkg_index.c \
            src/sm_fpkg.c src/sm_fpkg_layout.c src/sm_fpkg_image.c \
            src/sm_fpkg_decoder.c src/sm_fpkg_tree.c \
            -o /tmp/fpkg-ampr-generate
          /tmp/fpkg-ampr-generate /tmp/fpkg-ampr-oracle
          CARGO_TARGET_DIR=/tmp/fpkg-ampr-cargo cargo run --locked \
            --manifest-path tests/fpkg_ampr_oracle/Cargo.toml -- \
            /tmp/fpkg-ampr-oracle/ampr_emu.index \
            /tmp/fpkg-ampr-oracle/ampr_assets.index \
            /tmp/fpkg-ampr-oracle/kraken.pkg

      - name: Run FPKG cache and lifecycle host checks
        run: |
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude -Isrc -Itests \
            -include tests/host_platform.h -fsanitize=address,undefined \
            -fno-omit-frame-pointer tests/test_fpkg_backport.c \
            src/sm_fpkg_backport.c -o /tmp/sm-fpkg-backport-test
          /tmp/sm-fpkg-backport-test
          (cd vendor/ampr-emu-ng-v0.4.0 && \
            sha256sum --check --ignore-missing --strict SHA256SUMS)
          xxd -i -n sm_ampr_ng_runtime \
            vendor/ampr-emu-ng-v0.4.0/libSceAmpr.sprx \
            src/ampr_emu_ng_runtime_asset.c
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude -Isrc \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_ampr_runtime.c src/sm_ampr_runtime.c \
            src/ampr_emu_ng_runtime_asset.c \
            -o /tmp/sm-ampr-runtime-test
          /tmp/sm-ampr-runtime-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -Iinclude -Isrc -Itests \
            -include tests/host_platform.h \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_fpkg_cache.c src/sm_fpkg_backport.c src/sm_fpkg_cache.c src/sm_fpkg_index.c \
            -o /tmp/sm-fpkg-cache-test
          /tmp/sm-fpkg-cache-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror \
            -Wno-macro-redefined -Iinclude -Isrc -Itests \
            -include tests/host_platform.h \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_fpkg_cache_build.c src/sm_fpkg_backport.c src/sm_fpkg_cache.c src/sm_fpkg.c \
            src/sm_fpkg_layout.c src/sm_fpkg_image.c src/sm_fpkg_decoder.c \
            src/sm_fpkg_tree.c src/sm_fpkg_index.c \
            -o /tmp/sm-fpkg-cache-build-test
          /tmp/sm-fpkg-cache-build-test
          # Exercise the PS5-compatible path even on Linux with renameat2.
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror \
            -DSM_FPKG_FORCE_PORTABLE_RENAME -DSM_FPKG_TEST_RENAME \
            -Iinclude -Isrc -Itests -include tests/host_platform.h \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_fpkg_cache.c src/sm_fpkg_backport.c src/sm_fpkg_cache.c \
            src/sm_fpkg_index.c -o /tmp/sm-fpkg-cache-portable-test
          /tmp/sm-fpkg-cache-portable-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror \
            -DSM_FPKG_FORCE_PORTABLE_RENAME -Iinclude -Isrc -Itests \
            -include tests/host_platform.h -fsanitize=address,undefined \
            -fno-omit-frame-pointer tests/test_fpkg_cache_build.c \
            src/sm_fpkg_backport.c src/sm_fpkg_cache.c src/sm_fpkg.c \
            src/sm_fpkg_layout.c src/sm_fpkg_image.c src/sm_fpkg_decoder.c \
            src/sm_fpkg_tree.c src/sm_fpkg_index.c -o /tmp/sm-fpkg-build-portable-test
          /tmp/sm-fpkg-build-portable-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror \
            -Wno-macro-redefined -Iinclude -Isrc -Itests \
            -include tests/host_platform.h -ffunction-sections -fdata-sections \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_install_queue_fpkg.c src/sm_install_queue.c \
            -Wl,--gc-sections -o /tmp/sm-install-queue-fpkg-test
          /tmp/sm-install-queue-fpkg-test
          python3 tools/test_fpkg_install_lifecycle.py
          python3 tools/test_scan_permissions.py
          python3 tools/test_sandbox_cleanup.py

      - name: Configure pacman for locally built packages
        run: |
          sudo install -d -m 755 /var/lib/pacman/local /var/cache/pacman/pkg
          sudo tee /etc/pacman.conf > /dev/null <<'EOF'
          [options]
          Architecture = auto
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional
          EOF

      - name: Build PS5 payload SDK
        working-directory: pacbrew-repo/sdk
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 openlibm package
        working-directory: pacbrew-repo/openlibm
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build patched PS5 json-c
        run: |
          make json-c

      - name: Check json-c release memory ownership
        run: |
          python3 tools/build_ps5_json_c.py --host --sanitize --prefix /tmp/smp-json-release
          cc -std=gnu11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I/tmp/smp-json-release/include tools/check_json_c_release.c \
            /tmp/smp-json-release/lib/libjson-c.a -lm -o /tmp/smp-json-release-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/smp-json-release-test

      - name: Build PS5 zlib package
        working-directory: pacbrew-repo/zlib
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 libpng package
        working-directory: pacbrew-repo/libpng
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 libmicrohttpd package
        working-directory: pacbrew-repo/libmicrohttpd
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 libjpeg-turbo package
        working-directory: pacbrew-repo/libjpeg-turbo
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 sqlite package
        working-directory: pacbrew-repo/sqlite
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 libsmb2 package
        working-directory: pacbrew-repo/libsmb2
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz
          test -f /opt/ps5-payload-sdk/target/user/homebrew/include/smb2/smb2.h
          test -f /opt/ps5-payload-sdk/target/user/homebrew/include/smb2/libsmb2-raw.h
          test -s /opt/ps5-payload-sdk/target/user/homebrew/lib/libsmb2.a

      - name: Check API tools and manifest
        run: |
          python3 -m py_compile tools/api_test.py
          python3 -c 'import pathlib, yaml; yaml.safe_load(pathlib.Path("docs/openapi.yaml").read_text(encoding="utf-8"))'

      - name: Build payload
        run: |
          make clean
          make -j4 all PS5_SCE_STUBS_DIR="$GITHUB_WORKSPACE/ps5-sdk/sce_stubs"
          cp shadowmountplus.elf ShadowKraken.elf

      - name: Create release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version_tag="$(git describe --abbrev=6 --dirty --always --tags 2>/dev/null || echo "${GITHUB_SHA::7}")"
          archive_name="ShadowMountPlus_${version_tag}.zip"
          manifest_file=".github/release-files.txt"

          mapfile -t release_files < <(tr -d '\r' < "${manifest_file}" | grep -Ev '^[[:space:]]*(#|$)')

          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "Release manifest is empty: ${manifest_file}" >&2
            exit 1
          fi

          for release_file in "${release_files[@]}"; do
            if [ ! -f "${release_file}" ]; then
              echo "Missing release file: ${release_file}" >&2
              exit 1
            fi
          done

          zip -9 "${archive_name}" "${release_files[@]}"

          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error

      - name: Upload PS5 ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowKraken_PS5_${{ github.sha }}
          path: ShadowKraken.elf
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.archive_name }}
          path: dist

      - name: Download PS5 ELF artifact
        uses: actions/download-artifact@v4
        with:
          name: ShadowKraken_PS5_${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'Dev') }}
          generate_release_notes: true
          files: |
            dist/${{ needs.build.outputs.archive_name }}
            dist/ShadowKraken.elf
